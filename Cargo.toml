[package]
name = "cargo-teeny"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Cargo commands for the teeny cross-compiler toolchain"
license = "Apache-2.0"
repository = "https://github.com/teenygrad/cargo-teeny"
readme = "README.md"
keywords = ["cross-compile", "sysroot", "cargo-plugin"]
categories = ["development-tools::cargo-plugins"]

[[bin]]
name = "cargo-teeny"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
